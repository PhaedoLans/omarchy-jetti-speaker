<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#00FF41"/>
      <stop offset="55%"  stop-color="#3BD98A"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow" cx="42%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#00FF41" stop-opacity="0.22"/>
      <stop offset="65%"  stop-color="#A855F7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="48" cy="48" r="46" fill="url(#glow)"/>

  <!-- One wave per speaker in a group, green nearest the driver and purple
       furthest out — the same green-to-purple run as the cone. -->
  <g fill="none" stroke-linecap="round">
    <path d="M 52 31 A 23 23 0 0 1 52 65" stroke="#00FF41" stroke-width="5"   opacity="0.95"/>
    <path d="M 62 22 A 35 35 0 0 1 62 74" stroke="#5BE0A0" stroke-width="4.6" opacity="0.85"/>
    <path d="M 72 13 A 47 47 0 0 1 72 83" stroke="#A855F7" stroke-width="4.2" opacity="0.9"/>
  </g>

  <!-- the driver: basket, cone, dust cap -->
  <path d="M 40 36 L 40 60 L 26 60 L 26 36 Z" fill="url(#cone)" opacity="0.5"/>
  <path d="M 40 36 L 17 19 L 17 77 L 40 60 Z" fill="url(#cone)"/>
  <circle cx="28" cy="48" r="5.8" fill="#0D0D14" opacity="0.9"/>
  <circle cx="28" cy="48" r="2.5" fill="#00FF41"/>
</svg>
